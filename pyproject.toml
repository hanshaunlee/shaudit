[project]
name = "shaudit"
version = "0.1.0"
description = "Counterexample-guided shutdown auditing for cached, distributed AI workflows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "networkx>=3.2",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70", "openai>=1.50"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
shaudit = "shaudit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shaudit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
